# Agentic Factory: copy to .github/workflows/factory.yml in any repo.
# Docs: https://github.com/tiwadara/agentic-factory
name: Agentic Factory
# The reconciler matches runs to issues/PRs by "#<number>" in the run name; keep this format.
run-name: "🏭 ${{ github.event_name }} #${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.number || github.event.workflow_run.head_branch || github.event_name }}"

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]            # ← name(s) of your CI workflow(s), so failures trigger the fix stage
    types: [completed]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run
        type: choice
        options: [triage, implement, review, fix]
      number:
        description: Issue (triage/implement) or PR (review/fix) number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  factory:
    # Cheap pre-filter so unrelated events don't spin up the router.
    if: >-
      (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'factory:ready') &&
      (github.event_name != 'issue_comment' || !github.event.issue.pull_request) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    uses: tiwadara/agentic-factory/.github/workflows/factory.yml@v1
    secrets: inherit
    with:
      app-id: ${{ vars.FACTORY_APP_ID }}
      auto-approve: ${{ vars.FACTORY_AUTO_APPROVE == 'true' }}   # approve PRs that pass every auto-approval rule
      paused: ${{ vars.FACTORY_PAUSED == 'true' }}   # cordon: set repo variable FACTORY_PAUSED=true
      # Toolchain for the agent:
      python-version: "3.12"
      node-version: "22"
      verify: |
        python3 scripts/validate.py
        for f in studio-one/Neuzeit/Drop/*.js; do node --check "$f"; done
      instructions: |
        This repo is a Studio One 7 control-surface device (studio-one/Neuzeit/Drop/) plus a
        Neuzeit Drop controller config (drop-config/daw-init-studioone.json). Nothing here can be
        tested against real hardware in CI; scripts/validate.py is the only automated check.
        - Do not change device mapping semantics (MIDI channel/note/CC numbers, control names,
          behavId, the Launcher/mixer mappings) unless the issue asks for it, and then extend
          scripts/validate.py so the new mapping is checked.
        - drop-config/daw-init-studioone.json and docs/daw-init-studioone.json must stay
          byte-identical; edit the JSON surgically, never reformat or re-serialise the whole file.
        - In Drop.surface.xml declare note controls as status="#90" channel="#0F" with hex
          addresses (the channel-in-status form silently fails in Studio One).
        - Device scripts run in Studio One's JS engine (include_file, PreSonus.* globals), not Node.
        - Keep README.md mapping tables in sync with any mapping change.
      require-human-paths: '(^|/)(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|go\.(mod|sum)|Cargo\.(toml|lock)|Gemfile(\.lock)?|[^/]*\.gradle(\.kts)?|gradle/|libs\.versions\.toml|Dockerfile|docker-compose[^/]*|[^/]*\.tf|netlify\.toml|vercel\.json|AndroidManifest\.xml|Info\.plist)$|(^|/)(migrations?|auth|security|infra|deploy)/|^studio-one/|^drop-config/|^docs/daw-init-studioone\.json$|^scripts/|^LICENSE$'
      # auto-ready-sizes: xs,s,m
      # max-fix-attempts: 3
      # max-cost-usd: 5
      # merge-method: squash
